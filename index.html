<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F5F3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Поездка родителей в Китай</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="fonts/fonts.css">
<style id="css">
/* Layout: home = form cover with "now" list and four doors; each door opens a zone with its own world */
:root{
  --paper:#F2F5F3; --paper-2:#E6ECE8; --sheet:#FCFDFC;
  --ink:#15212A; --ink-2:#3D4B55; --ink-3:#53626B;
  --rule:#A9C2B6; --rule-soft:#D5E2DA; --frame:#2D4A3E;
  --seal:#C2352A; --seal-wash:#F8E3DF;
  --pen:#2A4DA6; --pen-wash:#E3E9F8;
  --amber:#955100; --amber-wash:#F7E8D1;
  --jade:#0F6E57; --jade-strong:#0A5343; --jade-wash:#DAECE2; --on-jade:#FFFFFF;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-title:"Noto Serif","PT Serif",Georgia,serif;
  --font-data:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --font-cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
  /* zone worlds */
  --health:#0A6E8A; --health-strong:#075870; --health-wash:#E1F1F6; --health-band:#0A6E8A; --health-band-ink:#FFFFFF;
  --travel:#1E3A6E; --travel-strong:#142A52; --travel-wash:#E5EBF6; --travel-band:#1E3A6E; --travel-band-ink:#FFFFFF; --travel-hi:#C98200;
  --leisure:#A0306E; --leisure-strong:#7E2256; --leisure-wash:#F8E6EF; --leisure-band:#A0306E; --leisure-band-ink:#FFFFFF;
  --docs:#0F6E57; --docs-strong:#0A5343; --docs-wash:#DAECE2; --docs-band:#0F6E57; --docs-band-ink:#FFFFFF;
  --map:#394855; --map-strong:#25313B; --map-wash:#E4E9ED; --map-band:#25313B; --map-band-ink:#FFFFFF;
  /* weather chart: validated pair (dataviz validator, light surface) */
  --wx-band:#2C6FB7; --wx-fc:#C77700;
  --day:#5B4AA0; --day-strong:#47398A; --day-wash:#ECE9F7; --day-band:#5B4AA0; --day-band-ink:#FFFFFF;
  --hi:#FFE38A; --hi-ink:#3A2C00; --on-seal:#FFFFFF; --warm:#B4480B; --cold:#1F5FB0; --on-amber:#FFFFFF; --on-pen:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --paper-2:#18211D; --sheet:#151D19;
  --ink:#E4ECE7; --ink-2:#B8C6BE; --ink-3:#98A89F;
  --rule:#3B5D50; --rule-soft:#253A31; --frame:#5D8B78;
  --seal:#FF7C6D; --seal-wash:#3B1D1A;
  --pen:#9EB5FF; --pen-wash:#1C2647;
  --amber:#F2AE55; --amber-wash:#3A2A13;
  --jade:#4FC29C; --jade-strong:#80D9B9; --jade-wash:#16332A; --on-jade:#08201A;
  --health:#5CC6E2; --health-strong:#93DCEE; --health-wash:#0F2F39; --health-band:#0E3A47; --health-band-ink:#E4F6FB;
  --travel:#93B2F2; --travel-strong:#BBCFF7; --travel-wash:#18233D; --travel-band:#1A2A4D; --travel-band-ink:#E6EDFB; --travel-hi:#F2B54A;
  --leisure:#F08CC1; --leisure-strong:#F6B4D8; --leisure-wash:#36182A; --leisure-band:#4A1D36; --leisure-band-ink:#FBE8F2;
  --docs:#4FC29C; --docs-strong:#80D9B9; --docs-wash:#16332A; --docs-band:#143A2F; --docs-band-ink:#E2F5EE;
  --map:#A9BCC9; --map-strong:#CCD9E2; --map-wash:#1A232A; --map-band:#1E2931; --map-band-ink:#E8EEF2;
  --wx-band:#4A86D6; --wx-fc:#BD7C10;
  --day:#B3A6F2; --day-strong:#CFC6F7; --day-wash:#231E3D; --day-band:#2A2350; --day-band-ink:#EEEAFE;
  --hi:#5A4A10; --hi-ink:#FFF2C2; --on-seal:#2A0B07; --warm:#FF9A5C; --cold:#7FB2FF; --on-amber:#1E1100; --on-pen:#0B1230;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1513; --paper-2:#18211D; --sheet:#151D19;
  --ink:#E4ECE7; --ink-2:#B8C6BE; --ink-3:#98A89F;
  --rule:#3B5D50; --rule-soft:#253A31; --frame:#5D8B78;
  --seal:#FF7C6D; --seal-wash:#3B1D1A;
  --pen:#9EB5FF; --pen-wash:#1C2647;
  --amber:#F2AE55; --amber-wash:#3A2A13;
  --jade:#4FC29C; --jade-strong:#80D9B9; --jade-wash:#16332A; --on-jade:#08201A;
  --health:#5CC6E2; --health-strong:#93DCEE; --health-wash:#0F2F39; --health-band:#0E3A47; --health-band-ink:#E4F6FB;
  --travel:#93B2F2; --travel-strong:#BBCFF7; --travel-wash:#18233D; --travel-band:#1A2A4D; --travel-band-ink:#E6EDFB; --travel-hi:#F2B54A;
  --leisure:#F08CC1; --leisure-strong:#F6B4D8; --leisure-wash:#36182A; --leisure-band:#4A1D36; --leisure-band-ink:#FBE8F2;
  --docs:#4FC29C; --docs-strong:#80D9B9; --docs-wash:#16332A; --docs-band:#143A2F; --docs-band-ink:#E2F5EE;
  --map:#A9BCC9; --map-strong:#CCD9E2; --map-wash:#1A232A; --map-band:#1E2931; --map-band-ink:#E8EEF2;
  --wx-band:#4A86D6; --wx-fc:#BD7C10;
  --day:#B3A6F2; --day-strong:#CFC6F7; --day-wash:#231E3D; --day-band:#2A2350; --day-band-ink:#EEEAFE;
  --hi:#5A4A10; --hi-ink:#FFF2C2; --on-seal:#2A0B07; --warm:#FF9A5C; --cold:#7FB2FF; --on-amber:#1E1100; --on-pen:#0B1230;
  color-scheme:dark}
.zone-home{--z:var(--ink);--z-strong:var(--ink);--z-wash:var(--paper-2);--z-band:var(--sheet);--z-band-ink:var(--ink)}
.zone-health{--z:var(--health);--z-strong:var(--health-strong);--z-wash:var(--health-wash);--z-band:var(--health-band);--z-band-ink:var(--health-band-ink)}
.zone-travel{--z:var(--travel);--z-strong:var(--travel-strong);--z-wash:var(--travel-wash);--z-band:var(--travel-band);--z-band-ink:var(--travel-band-ink)}
.zone-leisure{--z:var(--leisure);--z-strong:var(--leisure-strong);--z-wash:var(--leisure-wash);--z-band:var(--leisure-band);--z-band-ink:var(--leisure-band-ink)}
.zone-docs{--z:var(--docs);--z-strong:var(--docs-strong);--z-wash:var(--docs-wash);--z-band:var(--docs-band);--z-band-ink:var(--docs-band-ink)}
.zone-day{--z:var(--day);--z-strong:var(--day-strong);--z-wash:var(--day-wash);--z-band:var(--day-band);--z-band-ink:var(--day-band-ink)}
.zone-map{--z:var(--map);--z-strong:var(--map-strong);--z-wash:var(--map-wash);--z-band:var(--map-band);--z-band-ink:var(--map-band-ink)}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--font-ui);-webkit-text-size-adjust:100%}
::selection{background:var(--jade-wash);color:var(--ink)}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
*{scrollbar-color:var(--rule) transparent;scrollbar-width:thin}
svg{width:1.05em;height:1.05em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em}
svg text{stroke:none}
a{color:var(--z-strong,var(--jade-strong));text-decoration-thickness:1px;text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--font-title);text-wrap:balance;margin:0;line-height:1.22;color:var(--ink)}
h1{font-size:1.8rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.32rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
code,.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
code{font-size:.84em;background:var(--paper-2);padding:.08em .35em;border-radius:2px;overflow-wrap:anywhere}
.cjk{font-family:var(--font-cjk)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:12px 56px}

/* top switcher */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--rule-soft);margin-inline:-16px;padding-inline:16px}
.topbar-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.topbar-in::-webkit-scrollbar{display:none}
/* phones: every zone stays in sight on two rows; a sideways scroll was not discoverable */
@media (max-width:640px){.topbar-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;gap:6px}.topbar .zbtn{min-height:54px;padding:6px 8px;font-size:1.02rem;line-height:1.15;white-space:normal;text-align:center;justify-content:center;border-radius:12px;box-shadow:inset 0 -4px 0 var(--z)}.topbar .zbtn .zdot{display:none}}
.zbtn{appearance:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink);font:600 .95rem var(--font-ui);white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.zbtn .zdot{width:10px;height:10px;border-radius:50%;background:var(--z)}
.zbtn:hover{border-color:var(--z)}
.zbtn.on{background:var(--z-band);border-color:var(--z-band);color:var(--z-band-ink)}
.zbtn.on .zdot{background:var(--z-band-ink)}
.zone-home.zbtn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.zone-home.zbtn.on .zdot{background:var(--paper)}

/* shared blocks */
.page{display:flex;flex-direction:column;gap:30px;padding-top:18px}
.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.block>h2,.bhead{padding-bottom:8px;border-bottom:2px solid var(--z,var(--rule))}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lead{color:var(--ink-2);max-width:72ch}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:30px 40px}
@media (max-width:880px){.cols{grid-template-columns:1fr}}
.empty{color:var(--ink-3);padding:6px 0;max-width:70ch}
.link{appearance:none;border:0;background:none;padding:6px 0;font:600 .95rem var(--font-ui);color:var(--z-strong,var(--jade-strong));cursor:pointer;align-self:flex-start;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.lab{font-size:.74rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--z-strong,var(--jade-strong))}

/* status tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;font-weight:700;padding:4px 10px 4px 8px;border-radius:3px;white-space:nowrap;line-height:1.3;border:1px solid var(--rule)}
.t-done{color:var(--on-jade);border-color:var(--jade);background:var(--jade)}
.t-buy{color:var(--on-amber);border-color:var(--amber);background:var(--amber)}
.t-check{color:var(--on-pen);border-color:var(--pen);background:var(--pen)}
.t-plan{color:var(--ink-2);background:transparent}
.zchip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--z-strong);white-space:nowrap}
.zchip i{width:9px;height:9px;border-radius:50%;background:var(--z)}

/* home cover */
.head{background:var(--sheet);border:1px solid var(--frame);border-top-width:4px;margin-top:14px}
.head-top{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start;padding:18px 20px 16px;border-bottom:1px solid var(--rule)}
.head-sub{margin-top:6px;color:var(--ink-2);max-width:70ch}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--rule);border-radius:999px;font-size:.82rem;color:var(--ink-2);background:var(--paper);max-width:100%}
.chip.edit{border-color:var(--jade);color:var(--jade-strong)}
.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cell{padding:12px 20px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:last-child{border-right:0}
.cell .lab{color:var(--jade-strong)}
.val{font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.sub{font-size:.86rem;color:var(--ink-3)}
.days{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:2px;margin-top:5px;max-width:210px}
.days i{display:block;aspect-ratio:1;border:1px solid var(--rule)}
.days i.on{background:var(--jade);border-color:var(--jade)}
.days i.past{background:var(--jade-strong);border-color:var(--jade-strong)}
.counts{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:1rem;font-weight:600}
.counts span{display:inline-flex;align-items:center;gap:5px}
.c-done{color:var(--jade)} .c-buy{color:var(--amber)} .c-check{color:var(--pen)}
@media (max-width:760px){
  .ledger{grid-template-columns:1fr 1fr}
  .cell:nth-child(2){border-right:0}
  .cell:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .cell{padding:10px 14px 12px}
  .head-top{padding:14px}
  h1{font-size:1.45rem}
  .val{font-size:1.12rem}
}
.now{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-soft)}
.now li{border-bottom:1px solid var(--rule-soft)}
.now button{appearance:none;width:100%;display:grid;grid-template-columns:6.6rem minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 4px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.now button:hover{background:var(--z-wash)}
.now .what{font-weight:600}
.now .due{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.now .due b{font:600 1rem var(--font-data)}
.now .due span{font-size:.8rem;color:var(--ink-3)}
.now .hot .due b,.now .hot .due span{color:var(--amber)}
@media (max-width:560px){.now button{grid-template-columns:5.6rem minmax(0,1fr)}.now .zchip{grid-column:2}}

/* doors */
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.doors{grid-template-columns:1fr}}
.door{appearance:none;position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:16px;row-gap:6px;align-items:start;text-align:left;min-height:150px;padding:20px 22px;background:var(--sheet);border:1px solid var(--z);color:var(--ink);font:inherit;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.door:hover{transform:translateY(-2px);box-shadow:0 8px 20px -12px color-mix(in srgb,var(--z) 60%,transparent)}
.door-icon{grid-row:1/4;width:56px;height:56px;display:grid;place-items:center;background:var(--z-band);color:var(--z-band-ink)}
.door-icon svg{width:30px;height:30px;stroke-width:1.7}
.door-title{font-family:var(--font-title);font-size:1.32rem;font-weight:700;line-height:1.2;position:relative}
.door-sum{color:var(--ink-2);position:relative}
.door-foot{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;font-weight:600;color:var(--z-strong);position:relative}
.door-health{border-radius:16px}
.door-health .door-icon{border-radius:14px}
.door-travel{border-radius:10px;border-style:solid}
.door-travel .door-icon{border-radius:8px}
.door-travel::before,.door-travel::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--paper);border:1px solid var(--z)}
.door-travel::before{left:-10px} .door-travel::after{right:-10px}
.door-leisure{border-radius:6px}
.door-leisure .door-icon{border-radius:50%}
.door-leisure .glyph{position:absolute;right:10px;bottom:-14px;font:700 5.2rem/1 var(--font-cjk);color:var(--z);opacity:.1;pointer-events:none}
.door-docs{border-radius:2px;border-top-width:4px}
.door-docs .door-icon{border-radius:2px}

/* zone header band */
.zhead{margin-top:14px;background:var(--z-band);color:var(--z-band-ink);padding:22px 22px 20px;display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:flex-end;position:relative;overflow:hidden}
.zhead h1{color:var(--z-band-ink);font-size:2rem}
.zhead p{color:var(--z-band-ink);opacity:.88;margin-top:6px;max-width:58ch}
.zh-main{display:flex;gap:16px;align-items:flex-start;position:relative}
.zh-icon{width:54px;height:54px;flex:none;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--z-band-ink) 55%,transparent)}
.zh-icon svg{width:30px;height:30px}
.zh-now{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;background:color-mix(in srgb,var(--z-band-ink) 12%,transparent);border:1px solid color-mix(in srgb,var(--z-band-ink) 30%,transparent);padding:10px 14px;max-width:26rem;display:flex;flex-direction:column;gap:2px}
.zh-now .lab{color:var(--z-band-ink);opacity:.85}
.zh-now b{font-size:1.02rem}
button.zh-now:hover{background:color-mix(in srgb,var(--z-band-ink) 20%,transparent)}
.zone-health .zhead{border-radius:16px}
.zone-health .zh-icon{border-radius:14px}
.zone-health .ecg{position:absolute;left:0;right:0;bottom:8px;height:40px;opacity:.22;stroke:var(--z-band-ink);stroke-width:1.6;width:100%}
.zone-travel .zhead{border-radius:10px 10px 0 0}
.zone-travel .zhead::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 7px 10px,var(--paper) 6px,transparent 6.5px) 0 0/14px 10px repeat-x}
.zone-travel .zh-icon{border-radius:8px}
.zone-leisure .zhead{border-radius:6px}
.zone-leisure .zh-icon{border-radius:50%}
.zone-leisure .zglyph{position:absolute;right:18px;top:-18px;font:700 8rem/1 var(--font-cjk);opacity:.12;color:var(--z-band-ink);pointer-events:none}
.zone-docs .zhead{border-top:4px solid var(--z-band-ink)}
@media (max-width:640px){.zhead{padding:18px 16px}.zhead h1{font-size:1.55rem}.zh-icon{width:46px;height:46px}}

/* in-zone sections */
.subnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-top:14px}
.sbtn{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:10px 14px;border:1.5px solid color-mix(in srgb,var(--z) 35%,var(--rule));background:var(--sheet);color:var(--ink);font:600 1rem/1.25 var(--font-ui);text-align:left;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.sbtn:hover{border-color:var(--z)}
.sbtn.on{background:var(--z-wash);border-color:var(--z);color:var(--z-strong);box-shadow:inset 0 -3px 0 var(--z)}
.sbtn .n{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 .4em;border-radius:999px;background:var(--z-band);color:var(--z-band-ink);font:600 .76rem var(--font-data)}
.zone-health .sbtn{border-radius:12px}
.zone-travel .sbtn{border-radius:8px}
.zone-leisure .sbtn{border-radius:6px}
.zone-docs .sbtn{border-radius:2px}
@media (max-width:420px){.subnav{grid-template-columns:1fr 1fr}.sbtn{font-size:.95rem;padding:9px 11px}}

/* tasks list (per zone) */
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-soft)}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--rule-soft);align-items:start}
.task-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.task-title{font-weight:600}
.task p{color:var(--ink-2);font-size:.94rem}
.task-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.task.is-done .task-title{color:var(--ink-2)}
.due-s{font:600 .86rem var(--font-data);color:var(--ink-2);white-space:nowrap}
.hot .due-s,.due-s.hot{color:var(--amber)}
.mini{appearance:none;min-height:40px;padding:7px 13px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:600 .86rem var(--font-ui);border-radius:3px;cursor:pointer;transition:border-color .15s,color .15s}
.mini:hover{border-color:var(--z,var(--jade));color:var(--z-strong,var(--jade-strong))}
.mini.danger{border-color:var(--amber);color:var(--amber)}

/* crowds */
:root{--cr0:var(--jade-wash);--cr1:var(--hi);--cr2:var(--warm)}
.cr-lvl{display:inline-block;font-weight:800;font-size:.9rem;border-radius:6px;padding:3px 10px}
.cr-lvl.l0{background:var(--jade);color:var(--on-jade)}.cr-lvl.l1{background:var(--hi);color:var(--hi-ink)}.cr-lvl.l2{background:var(--warm);color:#fff}
.cr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cr-ev{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--rule-soft);padding-top:8px}
.cr-adv{font-weight:600;color:var(--ink)}
.cr-scale{display:grid;grid-template-columns:repeat(7,minmax(0,58px));gap:5px;padding:4px 0 8px}
.cr-wh{font-size:.74rem;font-weight:700;color:var(--ink-3);text-align:center;text-transform:uppercase}
.cr-d{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:48px;padding:4px 0;border-radius:8px;border:2px solid transparent;font:inherit;cursor:pointer}
.cr-d span{font-size:.68rem;font-weight:700;opacity:.85}.cr-d b{font:700 1.08rem var(--font-data)}
.cr-d.l0{background:var(--cr0);color:var(--ink)}.cr-d.l1{background:var(--cr1);color:var(--hi-ink)}.cr-d.l2{background:var(--cr2);color:#fff}
.cr-d.we{border-color:var(--ink)}
.cr-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.84rem;color:var(--ink-3);margin:0}
.cr-legend i{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:-6px}
.cr-legend .l0{background:var(--cr0);border:1px solid var(--rule)}.cr-legend .l1{background:var(--cr1)}.cr-legend .l2{background:var(--cr2)}
.cr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cr-card{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--cr1)}
.cr-card.l2{border-left-color:var(--cr2)}.cr-card.l0{border-left-color:var(--jade)}
.cr-card h3{margin:0;font-size:1.06rem}.cr-card p{margin:0;color:var(--ink-2)}.cr-card .cr-adv{color:var(--ink)}
.cr-notes{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.dchip.cr1::after,.dchip.cr2::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:4px;border-radius:2px;background:var(--cr1)}
.dchip.cr2::after{background:var(--cr2)}
/* category stickers: hotel / train / plane / taxi... a coloured tile with a white silhouette, readable from afar */
:root{--k-hotel:#6A4BC0;--k-train:#1F4E9E;--k-plane:#1580BC;--k-taxi:#F2B705;--k-taxi-ink:#1E1E1E;--k-food:#C9561A;--k-health:#0B7F86;--k-sight:#A62E6E;--k-docs:#23794B;--k-wait:#9A6400;--k-home:#55687A;--k-shield:#4357A8;--k-sim:#37474F;--k-bday:#D0386E}
span.kico{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;border-radius:10px;background:var(--k);color:#fff;box-shadow:0 0 0 2px var(--sheet),0 2px 6px rgba(20,30,40,.22)}
span.kico>svg{width:72%;height:72%;fill:currentColor;stroke:none;margin:0;color:inherit}
span.kico.s{width:28px;height:28px;border-radius:8px}
span.kico.l{width:42px;height:42px;border-radius:12px}
.k-hotel{--k:var(--k-hotel)}.k-train{--k:var(--k-train)}.k-plane{--k:var(--k-plane)}.k-food{--k:var(--k-food)}.k-health{--k:var(--k-health)}.k-sight{--k:var(--k-sight)}
.k-crowd{--k:var(--warm)}.k-docs{--k:var(--k-docs)}.k-wait{--k:var(--k-wait)}.k-home{--k:var(--k-home)}.k-shield{--k:var(--k-shield)}.k-sim{--k:var(--k-sim)}.k-bday{--k:var(--k-bday)}
span.kico.k-taxi{--k:var(--k-taxi);color:var(--k-taxi-ink)}
.kti{display:flex;align-items:center;gap:10px;min-width:0}
.dnotes li span.kico{margin-top:-2px}
/* check-in gap: arrival before the room is ready, or check-out long before leaving */
.ci{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
.ci-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ci-head b{font-size:1.06rem}
.ci-wait{font:800 1.5rem var(--font-ui);color:var(--hi-ink);background:var(--hi);border-radius:10px;padding:4px 12px;white-space:nowrap}
.ci-wait.ok{color:var(--on-jade);background:var(--jade)}
.ci-bar{position:relative;display:grid;grid-template-columns:var(--ci-a) var(--ci-b) var(--ci-c);height:14px;border-radius:7px;overflow:hidden;background:var(--paper-2)}
.ci-bar i{display:block}
.ci-bar .r{background:var(--rule)}
.ci-bar .w{background:repeating-linear-gradient(135deg,var(--amber) 0 6px,var(--hi) 6px 12px)}
.ci-bar .k{background:var(--jade)}
.ci-marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.9rem;color:var(--ink-2)}
.ci-marks span:nth-child(2){text-align:center}.ci-marks span:last-child{text-align:right}
.ci-marks b{display:block;font:700 1.12rem var(--font-data);color:var(--ink)}
.ci-q{font-weight:700;font-size:1.02rem;margin-top:2px}
.ci-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ci-opt{display:flex;flex-direction:column;gap:6px;padding:12px;border:2px solid var(--rule);border-radius:10px;background:var(--paper)}
.ci-opt h4{margin:0;font:700 1rem/1.3 var(--font-ui);text-align:left;display:flex;gap:8px;align-items:center}
.ci-opt h4 svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ci-opt p{margin:0;color:var(--ink-2);font-size:.94rem}
.ci-opt .g{align-self:flex-start;font-size:.84rem;font-weight:700;border-radius:6px;padding:2px 8px}
.ci-opt .g.yes{color:var(--on-jade);background:var(--jade)}
.ci-opt .g.no{color:var(--on-amber);background:var(--amber)}
.ci-done{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--jade-wash);color:var(--ink);font-weight:600}
.ci-done svg{width:22px;height:22px;flex:none;color:var(--jade)}
.ci-note{color:var(--ink-2);font-size:.92rem}
.ci-list{display:flex;flex-direction:column;gap:12px}
@media (max-width:640px){.ci-opts{grid-template-columns:1fr}}
.ci-bar4{grid-template-columns:var(--ci-a) var(--ci-b) var(--ci-c) 1fr}
.ci-bar .a,.ci-legend .a{background:var(--pen)}
.ci-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:.84rem;color:var(--ink-3);margin:0}
.ci-legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:-6px}
.ci-legend .r{background:var(--rule)}.ci-legend .w{background:repeating-linear-gradient(135deg,var(--amber) 0 4px,var(--hi) 4px 8px)}.ci-legend .k{background:var(--jade)}
.ci-verdict{padding:12px 14px;border-radius:10px;border:2px solid var(--jade);background:var(--jade-wash)}
.ci-verdict b{display:block;font-size:1.08rem;color:var(--jade-strong)}
.ci-verdict.must{border-color:var(--seal);background:var(--seal-wash)}.ci-verdict.must b{color:var(--seal)}
.ci-verdict.soft{border-color:var(--pen);background:var(--pen-wash)}.ci-verdict.soft b{color:var(--pen)}
.ci-verdict ul{margin:6px 0 0;padding-left:1.1em;color:var(--ink)}
.ci-why{margin:0;padding-left:1.1em;color:var(--ink)}
.ci-calc{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--paper)}
.ci-calc h4{margin:0;font:700 .95rem var(--font-ui)}
.ci-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ci-steps li{display:flex;justify-content:space-between;gap:12px;font-size:.94rem;border-bottom:1px dashed var(--rule-soft);padding-bottom:4px}
.ci-steps li b{white-space:nowrap;font-family:var(--font-data);font-size:.9rem}
.ci-steps li.sum{border:0;font-weight:700}
.ci-areas{width:100%;border-collapse:collapse;font-size:.92rem}
.ci-areas th{text-align:left;font-weight:600;color:var(--ink-3);font-size:.82rem;padding:4px 6px 4px 0}
.ci-areas td{padding:6px 6px 6px 0;border-top:1px solid var(--rule-soft);vertical-align:top}
.ci-areas td:nth-child(n+2){white-space:nowrap;font-family:var(--font-data);font-size:.86rem}
.ci-areas tr.plan td{font-weight:700}
.ci-areas small{font:700 .72rem var(--font-ui);color:var(--on-pen);background:var(--pen);border-radius:4px;padding:1px 5px}
.ci-opt{position:relative}
.ci-opt.rec{border-color:var(--jade);background:var(--jade-wash)}
.ci-rec{align-self:flex-start;font-size:.8rem;font-weight:800;color:var(--on-jade);background:var(--jade);border-radius:6px;padding:2px 8px}
.ci-warn{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:10px;background:var(--amber-wash);color:var(--ink);font-weight:600}
.ci-warn svg{width:22px;height:22px;flex:none;color:var(--amber);fill:none;stroke:currentColor;stroke-width:1.8}
@media (max-width:640px){.ci-areas thead{display:none}.ci-areas tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px 8px;border-top:1px solid var(--rule-soft);padding:6px 0}.ci-areas td{border:0;padding:0}.ci-areas td:first-child{grid-column:1/-1}}
.dtile{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
.dtile-t{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;color:var(--ink-2)}
.dtile-t b{font:700 2rem var(--font-data);color:var(--warm);margin-right:5px}
.dtile .fc{color:var(--amber);font-weight:600;font-size:.92rem}
.dnotes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dnotes li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--z-wash);border-radius:10px}
.dnotes svg{color:var(--z-strong);margin-top:.22em}
.dquick{display:flex;flex-wrap:wrap;gap:8px}
.dquick .btn{border-radius:999px}
.dideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.didea{padding:12px 14px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;gap:6px;--z:var(--leisure)}
.didea .big{font:700 1.5rem/1.1 var(--font-cjk);color:var(--leisure)}
.didea .nm{font-weight:700}
.didea p{color:var(--ink-2);font-size:.94rem}
.didea .walk i.on{background:var(--leisure)}

/* ===== MAP: decision canvas ===== */
.door-map{grid-column:1/-1;border-radius:12px;background-image:radial-gradient(color-mix(in srgb,var(--ink) 12%,transparent) 1px,transparent 1.3px);background-size:18px 18px}
.door-map .door-icon{border-radius:12px}
.zone-map .zhead{border-radius:12px}
.zone-map .zh-icon{border-radius:12px}
.cvwrap{position:relative;margin-top:14px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.cv{position:relative;height:min(74vh,780px);min-height:440px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background-color:var(--paper);background-image:radial-gradient(color-mix(in srgb,var(--ink) 14%,transparent) 1px,transparent 1.3px);background-size:22px 22px;outline-offset:-3px}
.cv.dragging{cursor:grabbing}
.cv svg{display:block;width:100%;height:100%;fill:none;stroke:none}
.cv text{fill:var(--ink);font-family:var(--font-ui)}
.cv .nd{cursor:pointer}
.cv .nd:focus{outline:none}
.cv .nd:focus-visible rect,.cv .nd:focus-visible .dia{stroke:var(--pen);stroke-width:3}
.lz-health{--zc:var(--health);--zw:var(--health-wash)} .lz-travel{--zc:var(--travel);--zw:var(--travel-wash)} .lz-leisure{--zc:var(--leisure);--zw:var(--leisure-wash)} .lz-docs{--zc:var(--docs);--zw:var(--docs-wash)}
.lane{fill:var(--zw);opacity:.6}
.lane-t{font:700 16px var(--font-title);fill:var(--zc)!important}
.grid{stroke:color-mix(in srgb,var(--ink) 8%,transparent);stroke-width:1}
.ax-t{font:600 11.5px var(--font-data);fill:var(--ink-2)!important}
.ax-w{font:500 10px var(--font-ui);fill:var(--ink-3)!important}
.mk{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:6 5}
.mk.today{stroke:var(--pen);stroke-width:2;stroke-dasharray:none}
.mk-t{font:700 12px var(--font-ui);fill:var(--ink-2)!important;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.mk-t.today{fill:var(--pen)!important}
.rt{stroke:var(--jade);stroke-width:4;stroke-linecap:round}
.rt.open{stroke:var(--amber);stroke-dasharray:9 7}
.stn{fill:var(--sheet);stroke:var(--jade);stroke-width:3}
.stn.open{stroke:var(--amber)}
.stn-t{font:700 13.5px var(--font-title)}
.stn-s{font:600 11px var(--font-data);fill:var(--ink-3)!important}
.nd rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2}
.nd:hover rect{stroke:var(--ink-3)}
.nd.sel rect{stroke:var(--pen);stroke-width:2.6}
.nd .tt{font:600 12.5px var(--font-ui)}
.nd .fs{font:600 11px var(--font-data);fill:var(--ink-3)!important}
.fork .dia{fill:var(--zc);stroke:var(--sheet);stroke-width:2}
.fork.sel .dia{stroke:var(--pen);stroke-width:3}
.fork .ft{font:700 14px var(--font-ui)}
.opt.rec rect{stroke:var(--jade);stroke-width:2}
.opt.chosen rect{fill:var(--seal-wash);stroke:var(--seal);stroke-width:2.4}
.opt.rej{opacity:.45}
.opt.rej rect{stroke-dasharray:4 3}
.ot{font:700 10.5px var(--font-ui);fill:var(--ink-3)!important;letter-spacing:.04em}
.ot.rec{fill:var(--jade-strong)!important} .ot.chosen{fill:var(--seal)!important}
.br{stroke:var(--zc);stroke-width:1.8;opacity:.6}
.br.rec{stroke:var(--jade);opacity:.9;stroke-width:2.2}
.br.chosen{stroke:var(--seal);stroke-width:3.4;opacity:1}
.br.rej{stroke-dasharray:2 5;opacity:.3}
.task.is-done{opacity:.6}
.ms rect{fill:var(--zw);stroke:var(--zc);stroke-width:1.4}
.sd.done{fill:var(--jade)}
.sd-c{stroke:var(--sheet);stroke-width:2;fill:none}
.sd.buy{fill:var(--amber-wash);stroke:var(--amber);stroke-width:2}
.sd.check{fill:var(--pen-wash);stroke:var(--pen);stroke-width:2;stroke-dasharray:3 2}
.lk{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
.arrh{fill:var(--ink-3)}
.lk-t{font:600 11px var(--font-ui);fill:var(--ink-2)!important;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.cv-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.cv-tools button,.cv-zoom{min-height:40px;min-width:40px;display:inline-grid;place-items:center;padding:6px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:600 .9rem var(--font-ui);border-radius:8px}
.cv-zoom{border-color:transparent}
.cv-tools button{cursor:pointer}
.cv-tools button:hover{border-color:var(--ink-3)}
.cv-zoom{font:600 .82rem var(--font-data);min-width:58px}
.cv-panel{position:absolute;top:68px;right:10px;bottom:10px;width:min(370px,44%);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 34px -20px rgba(0,0,0,.5);z-index:3}
.cv-panel h3{font-size:1.15rem}
.cv-panel .opts{grid-template-columns:1fr;border-radius:10px}
.cvp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cv-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:.92rem;color:var(--ink-2)}
.cv-legend li{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cv-legend svg{width:28px;height:14px;flex:none}
.lg-dia{fill:var(--travel);stroke:none}
.lg-ch{stroke:var(--seal);stroke-width:3.4}
.lg-rej{stroke:var(--ink-3);stroke-width:2;stroke-dasharray:2 5;opacity:.5}
.lg-lk{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:6 4}
@media (max-width:760px){.cv{height:62vh;min-height:380px}.cv-panel{position:static;width:auto;box-shadow:none;border:0;border-top:1px solid var(--rule);border-radius:0}}


/* help button, SOS sheet, big "show" screen, now & next */
.sos-fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:30;display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:0 20px 0 16px;border:0;border-radius:999px;background:var(--seal);color:var(--on-seal);font:800 1.05rem var(--font-ui);box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.sos-fab svg,.sos-call svg,.drv-x svg,.mini svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sos-fab:focus-visible,.sh-x:focus-visible,.drv:focus-visible,.sos-ph:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sos{gap:14px}
.sos-call small{font-weight:600;opacity:.85}
.sos-apps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sos-list .sos-apps .btn{width:auto}
.sos-wc{font-weight:600}
.sh-nums{display:flex;flex-direction:column;gap:6px}
.sh-nums a{font:800 clamp(1.8rem,8vw,3rem)/1.2 var(--font-data);color:#111;text-decoration:none}
.sos-call{width:100%;justify-content:center;min-height:58px;font-size:1.12rem;background:var(--jade);border-color:var(--jade);color:var(--on-jade);text-decoration:none}
.sos-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sos-num{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border:2px solid var(--seal);border-radius:10px;background:var(--seal-wash);color:var(--ink);text-decoration:none}
.sos-num b{font:800 1.7rem/1.1 var(--font-data);color:var(--seal)}
.sos-num span{font-weight:700}
.sos-num small{color:var(--ink-2)}
.sos-sec h3{margin:4px 0 8px;font-size:1.02rem}
.sos-list{display:grid;gap:8px}
.sos-list .btn{width:100%}
.sos-ph{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.sos-ph .cjk{font-size:1.3rem}
.sos-ph b{background:var(--hi);color:var(--hi-ink);padding:2px 8px;border-radius:5px}
.sos-ph small{color:var(--ink-2)}
.show{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;gap:10px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:#fff;color:#111;overflow:auto}
.sh-x{align-self:flex-end;display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 18px;border:2px solid #111;border-radius:999px;background:#fff;color:#111;font:700 1.02rem var(--font-ui);cursor:pointer}
.sh-x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sh-copy{display:inline-flex;align-items:center;gap:8px;min-height:50px;margin-top:8px;padding:0 20px;border:2px solid #111;border-radius:999px;background:#fff;color:#111;font:700 1.02rem var(--font-ui);cursor:pointer}
.sh-copy svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.stay-addr{align-self:flex-start}
.backbar{appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;margin-top:12px;padding:0 18px 0 12px;border:1.5px solid var(--z,var(--rule));border-radius:999px;background:var(--sheet);color:var(--z-strong,var(--ink));font:600 1rem/1.25 var(--font-ui);text-align:left;cursor:pointer}
.backbar svg{width:20px;height:20px;stroke-width:2.2}
.backbar:hover{background:var(--z-wash,var(--paper-2))}
.sh-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center}

const plural = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; };

function actText(key, text, own) {
  const r = ACT.find(a => a[0].test(text || ''));
  return key === 'buy' ? own || (r && r[2]) || 'Купить' : (r && r[3]) || '';

  const buy = key === 'buy', done = key === 'done' || key === 'bought';

}

function rel(due) { const d = daysBetween(todayUTC(), parseISO(due)); return {d, text: d < 0 ? 'просрочено на ' + days(-d) : d === 0 ? 'сегодня' : 'через ' + days(d)}; }

/* MRZ check digits (ICAO 9303) */
function cd(s) { const w = [7, 3, 1]; let t = 0; for (let i = 0; i < s.length; i++) { const c = s[i]; const v = c >= '0' && c <= '9' ? +c : c === '<' ? 0 : c.charCodeAt(0) - 55; t += v * w[i % 3]; } return String(t % 10); }
function checkMRZ(p) {
  const l = p.mrz2;
  const yymmdd = s => { const [d, m, y] = s.split('.'); return y.slice(2) + m + d; };
  return [
    {label:'номер', ok: cd(l.slice(0, 9)) === l[9]},
    {label:'дата рождения', ok: cd(l.slice(13, 19)) === l[19]},
    {label:'срок действия', ok: cd(l.slice(21, 27)) === l[27]},
    {label:'общая цифра', ok: cd(l.slice(0, 10) + l.slice(13, 20) + l.slice(21, 43)) === l[43]},
    {label:'совпадает с напечатанным', ok: l.slice(0, 9) === p.number && l.slice(13, 19) === yymmdd(p.dob) && l.slice(21, 27) === yymmdd(p.expires) && p.mrz1.indexOf(p.surname + '<<' + p.given) === 5}
  ];
}

function home() {
  const t = state.trip, today = todayUTC();
  const dep = parseISO(t.depart), entry = parseISO(t.entry), exit = parseISO(t.exit);
  const stay = daysBetween(entry, exit) + 1;
  let lab, val, sub;
  const dd = daysBetween(today, dep);
  if (dd > 0) { lab = 'До отправления'; val = days(dd); sub = ddmm(t.depart) + ', Тюмень, 11:52'; }
  else if (today < entry) { lab = 'В пути'; val = 'день ' + (daysBetween(dep, today) + 1); sub = 'въезд в Китай ' + ddmm(t.entry); }
  else if (today <= exit) { lab = 'В Китае'; val = 'день ' + (daysBetween(entry, today) + 1); sub = 'из ' + t.visaLimit + ' по безвизу'; }
  else { lab = 'Поездка'; val = 'завершена'; sub = ''; }

function spineSVG() {
  const S = state.health.spine;
  const segs = [];
  for (let i = 1; i <= 7; i++) segs.push({id:'C' + i, g:'C', w:30});
  for (let i = 1; i <= 12; i++) segs.push({id:'Th' + i, g:'Th', w:34 + i * 0.6});
  for (let i = 1; i <= 5; i++) segs.push({id:'L' + i, g:'L', w:44 + i});
  segs.push({id:'S', g:'S', w:46});
  const H = 11, GAP = 4.5, X = 92, top = 14;
  const y = {};
  let out = '', cur = top;
  segs.forEach((s, i) => {
    y[s.id] = cur + H / 2;
    const mark = S.marks.includes(s.id);
    out += '<rect class="v' + (mark ? ' mark' : '') + '" x="' + (X - s.w / 2) + '" y="' + cur + '" width="' + s.w + '" height="' + (s.id === 'S' ? H + 6 : H) + '" rx="3"><title>' + s.id + '</title></rect>';
    const nx = segs[i + 1];
    if (nx) {
      const key = s.id + '-' + nx.id, lvl = S.discs[key];
      const dy = cur + H + GAP / 2;
      y[key] = dy;
      out += '<line class="disc' + (lvl ? ' ' + lvl : '') + '" x1="' + (X - Math.min(s.w, nx.w) / 2 + 3) + '" y1="' + dy + '" x2="' + (X + Math.min(s.w, nx.w) / 2 - 3) + '" y2="' + dy + '"/>';
    }
    cur += H + GAP;
  });
  const grpY = g => { const ids = segs.filter(s => s.g === g).map(s => y[s.id]); return (ids[0] + ids[ids.length - 1]) / 2; };
  out += [['C', 'Шея'], ['Th', 'Грудной'], ['L', 'Поясница']].map(([g, n]) => '<text class="grp" x="58" y="' + (grpY(g) + 3) + '" text-anchor="end">' + n + '</text>').join('');
  S.labels.forEach(l => { const ly = y[l.at]; out += '<path class="lead" d="M' + (X + 26) + ' ' + ly + 'H' + (X + 44) + '"/><text class="lbl" x="' + (X + 48) + '" y="' + (ly + 3.5) + '">' + esc(l.text) + '</text>'; });
  if (S.marks.length > 1) { const a = y[S.marks[0]], b = y[S.marks[S.marks.length - 1]]; out += '<path class="lead" d="M' + (X + 22) + ' ' + a + 'V' + b + 'H' + (X + 20) + '"/>'; }
  return '<svg class="spine" viewBox="0 0 300 ' + (cur + top) + '" role="img" aria-label="Схема позвоночника: отмечены C5–C6, Th8, Th11, L4–L5">' + out + '</svg>';
}

    const ps = xa.places.filter(p => (p.days || []).includes(iso)), M = ['завтрак', 'обед', 'ужин', 'перекус'];
    const firsts = M.map(m => ps.find(p => p.meal === m)).filter(Boolean);

  }

    : iso >= '2026-10-29' && bf.length ? [bf[k % bf.length], meal[k % meal.length]] : [meal[k % meal.length], meal[(k + 1) % meal.length]];

}

  const w0 = rule - A.r1, w1 = rule - A.r0;   // shortest and longest wait
  let rec, lvl, why = [];
  if (c.night) why.push('Приезд после ночи в дороге — выспаться толком не получится.');
  if (A.r0 >= rule) { rec = null; lvl = 'ok'; }
  else {
    why.push('В отеле ≈ ' + ciRange(A.r0, A.r1) + ', а номер — с ' + c.rule + ': ждать ' + ciHours(w0, w1) + '.');
    why.push(...(c.why || []));
    if (A.r1 < 360 || w0 >= 360) { rec = 'prev'; lvl = 'must'; }
    else if (c.night && w0 >= 120) { rec = 'prev'; lvl = 'strong'; }
    else if (w1 <= 120) { rec = 'early'; lvl = 'soft'; }
    else { rec = 'bags'; lvl = 'soft'; }
  }
  return {at, rule, s0, s1, areas, A, w0, w1, rec, lvl, why};
}
const CI_VERDICT = {
  must: 'Обязательно бронировать с прошлой ночи',
  strong: 'Рекомендую: бронировать с прошлой ночи',
  early: 'Хватит раннего заезда: попросить отель заранее',
  bags: 'Можно без лишней ночи: чемоданы на ресепшен'
};
function ciCard(c) {
  const isIn = c.kind === 'in';
  if (!isIn) return ciOut(c);
  const P = ciPlan(c), A = P.A;
  const head = '<div class="ci-head"><b class="kti">' + kico('hotel') + esc(c.city) + ': когда можно в номер</b>' +
    (c.done || !P.rec || c.chosen === 'prev' ? '<span class="ci-wait ok">Ждать не нужно</span>' : '<span class="ci-wait">Ждать ' + ciHours(P.w0, P.w1) + '</span>') + '</div>';
  const verdict = (P.rec ? '<div class="ci-verdict ' + P.lvl + '"><b>' + esc(CI_VERDICT[P.lvl === 'soft' ? P.rec : P.lvl]) + '</b></div>' : '') + (c.done || c.chosenText ? '<p class="ci-done">' + SEAL_I + '<span>' + esc(c.done || c.chosenText) + '</span></p>' : '');
  // bar: airport / road / wait / room, by the middle of each range
  const air = (P.s0 + P.s1) / 2, road = (A.road[0] + A.road[1]) / 2, wait = Math.max(0, (P.w0 + P.w1) / 2), tot = air + road + wait + 60;
  const fr = n => (n / tot * 100).toFixed(1) + '%';
  const bar = '<div class="ci-bar ci-bar4" style="--ci-a:' + fr(air) + ';--ci-b:' + fr(road) + ';--ci-c:' + fr(wait) + '" aria-hidden="true"><i class="a"></i><i class="r"></i><i class="w"></i><i class="k"></i></div>' +
    '<div class="ci-marks"><span><b>' + c.at + '</b>' + esc(c.atWhat) + '</span><span><b>≈ ' + ciRange(A.r0, A.r1) + '</b>у отеля</span><span><b>' + c.rule + '</b>заселение по правилам</span></div>' +
    '<p class="ci-legend"><i class="a"></i>' + (c.steps && c.steps.length > 1 ? 'аэропорт' : 'вокзал') + '<i class="r"></i>дорога<i class="w"></i>ожидание<i class="k"></i>номер</p>';
  const steps = (c.steps || []).length ? '<div class="ci-calc"><h4>Из чего складывается</h4><ol class="ci-steps">' + c.steps.map(x => '<li><span>' + esc(x[0]) + '</span><b>' + x[1] + '–' + x[2] + ' мин</b></li>').join('') +
    '<li class="sum"><span>Итого до такси</span><b>' + (P.s0 === P.s1 ? P.s0 : P.s0 + '–' + P.s1) + ' мин</b></li></ol>' +
    (P.areas.length ? '<table class="ci-areas"><thead><tr><th>Куда ехать</th><th>Такси</th><th>У отеля</th><th>Ждать</th></tr></thead><tbody>' + P.areas.map(a => '<tr' + (a.plan ? ' class="plan"' : '') + '><td>' + esc(a.n) + (a.plan ? ' <small>план</small>' : '') + '</td><td>' + a.road[0] + '–' + a.road[1] + ' мин</td><td>' + ciRange(a.r0, a.r1) + '</td><td><b>' + (a.r0 >= P.rule ? '—' : ciHours(P.rule - a.r1, P.rule - a.r0)) + '</b></td></tr>').join('') + '</tbody></table>' : '') +
    (c.roadNote ? '<p class="ci-note">' + esc(c.roadNote) + '</p>' : '') + '</div>' : '';
  const key = 'ci-' + c.date + c.kind + c.city, note = c.note ? '<p class="ci-note">' + esc(c.note) + '</p>' : '';
  const why = P.rec && P.why.length ? '<ul class="ci-why">' + P.why.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '';
  if (c.done || !P.rec) return '<div class="ci">' + head + verdict + fold(key, why ? 'Почему и расчёт по времени' : 'Расчёт по времени', why + bar + steps + note) + '</div>';
  return '<div class="ci">' + head + verdict +
    (c.warn ? '<p class="ci-warn">' + I.alert + '<span>' + esc(c.warn) + '</span></p>' : '') +
    fold(key, 'Почему, расчёт по времени и три пути', why + bar + steps + '<p class="ci-q">Номер освободится только в ' + c.rule + '. Три пути:</p>' + ciOpts('in', P.rec, c.chosen) + note) + '</div>';
}
const ciOpts = (k, rec, ch) => '<div class="ci-opts">' + CI_OPTS[k].map(o => '<div class="ci-opt' + (o[0] === (ch || rec) ? ' rec' : '') + '">' + (o[0] === (ch || rec) ? '<span class="ci-rec">' + (ch ? 'Выбрано' : 'Рекомендую') + '</span>' : '') + '<h4>' + o[1] + esc(o[2]) + '</h4><p>' + esc(o[3]) + '</p><span class="g ' + (o[4] ? 'yes' : 'no') + '">' + (o[4] ? 'Точно' : 'Не гарантировано') + '</span></div>').join('') + '</div>';
function ciOut(c) {
  const at = ciMin(c.at), rule = ciMin(c.rule), gap = at - rule;
  const head = '<div class="ci-head"><b class="kti">' + kico('hotel') + esc(c.city) + ': выезд из номера</b>' + (gap <= 0 ? '<span class="ci-wait ok">Успеваете</span>' : '<span class="ci-wait">Без номера ≈ ' + ciHrs(gap) + '</span>') + '</div>';
  const fr = n => (n / (Math.max(gap, 0) + 60) * 100).toFixed(1) + '%';
  const bar = '<div class="ci-bar" style="--ci-a:' + fr(60) + ';--ci-b:' + fr(Math.max(gap, 0)) + ';--ci-c:0" aria-hidden="true"><i class="k"></i><i class="w"></i><i></i></div>' +
    '<div class="ci-marks"><span><b>' + c.rule + '</b>выезд по правилам</span><span></span><span><b>' + c.at + '</b>' + esc(c.atWhat) + '</span></div>';
  if (gap <= 0) return '<div class="ci">' + head + bar + '</div>';
  const rec = gap >= 360 ? 'extra' : gap > 120 ? 'late' : 'bags';
  const verdict = '<div class="ci-verdict ' + (rec === 'extra' ? 'strong' : 'soft') + '"><b>' + (rec === 'extra' ? 'Рекомендую: номер до вечера — поздний выезд или ещё сутки' : rec === 'late' ? 'Рекомендую: попросить поздний выезд' : 'Можно просто сдать чемоданы') + '</b><ul><li>' +
    esc('Номер сдать в ' + c.rule + ', а уезжать в ' + c.at + ': ' + ciHrs(gap) + ' без номера.') + '</li>' + (rec === 'extra' ? '<li>Перед ночным рейсом лучше отдохнуть в номере, а не ждать с чемоданами.</li>' : '') + '</ul></div>';
  return '<div class="ci">' + head + verdict + fold('ci-' + c.date + c.kind + c.city, 'Расчёт по времени и три пути', bar + '<p class="ci-q">Три пути:</p>' + ciOpts('out', rec) + (c.note ? '<p class="ci-note">' + esc(c.note) + '</p>' : '')) + '</div>';
}
const ciFor = iso => (state.checkins || []).filter(c => c.date === iso);

/* ---------- edits ---------- */
function commit() { state.meta.updated = isoToday(); const y = window.scrollY; render(); window.scrollTo(0, y); scheduleSave(); }
function toggleTask(id) { const t = state.tasks.find(x => x.id === id); if (!t) return; t.done = !t.done; if (t.done) justStamped.add(id); commit(); }
function choose(fid, oid) { const f = state.forks.find(x => x.id === fid); if (!f) return; f.chosen = f.chosen === oid ? null : oid; commit(); }
function delLog(i) { if (pendingDelete !== i) { pendingDelete = i; const y = window.scrollY; render(); window.scrollTo(0, y); return; } state.health.log.splice(i, 1); pendingDelete = null; commit(); }
function addLog(form) {
  const fd = new FormData(form);
  const proc = String(fd.get('proc') || '').trim(); if (!proc) return;
  state.health.log.push({date: String(fd.get('date') || isoToday()), who: String(fd.get('who') || 'T'), proc, place: String(fd.get('place') || '').trim(), cost: String(fd.get('cost') || '').trim(), feel: String(fd.get('feel') || ''), note: String(fd.get('note') || '').trim()});
  state.health.log.sort((a, b) => a.date.localeCompare(b.date));
  commit();
}

/* ---------- saving ---------- */
function buildDoc() {
  const hs = document.head && document.head.querySelector('style');
  const reset = hs && hs.textContent.indexOf('safe-area') > -1 ? hs.textContent : RESET_FALLBACK;
  const json = JSON.stringify(state, null, 1).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>' + esc(TITLE) + '</title>\n' + FONT_LINK + '\n<style id="css">' + SRC_CSS + '</style>\n<div id="app" class="app"></div>\n' +
    '<script type="application/json" id="trip-data">\n' + json + '\n<\/script>\n<script type="application/json" id="trip-files">' + FILES_RAW + '<\/script>\n<script id="app-js">' + SRC_JS + '<\/script></body></html>';
}
function scheduleSave() {
  if (mode === 'local') { saveLocal(); return; }
  if (mode !== 'edit') return;
  chipText = 'Сохраню через пару секунд…'; renderChip();
  clearTimeout(saveTimer); saveTimer = setTimeout(publishNow, 2500);
}
async function publishNow() {
  chipText = 'Сохраняю…'; renderChip();
  try { sessionStorage.setItem('trip-view', hashOf()); } catch (e) {}
  try { await artifactNs.publish(buildDoc()); retried = false; chipText = 'Сохранено'; renderChip(); }
  catch (err) { onPublishError(err); }
}
function onPublishError(err) {
  const code = err && err.code;
  if (code === 'conflict') chipText = 'Кто-то обновил страницу — загружаю свежую версию';
  else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) { mode = 'view'; chipText = ''; render(); return; }
  else if (code === 'rate_limited') { chipText = 'Слишком часто — сохраню через минуту'; clearTimeout(saveTimer); saveTimer = setTimeout(publishNow, 60000); }
  else if (code === 'too_large') chipText = 'Не сохранилось: страница слишком большая';
  else if (code === 'invalid_content' || code === 'transform_error') chipText = 'Не сохранилось: ошибка в данных страницы';
  else if (!retried) { retried = true; chipText = 'Связь прервалась — повторяю'; clearTimeout(saveTimer); saveTimer = setTimeout(publishNow, 1500 + Math.random() * 1500); }
  else { retried = false; chipText = 'Не сохранилось. Обновите страницу и повторите отметку'; }
  renderChip();
}
function saveLocal() {
  const o = {tasks: {}, forks: {}, meds: {}, log: state.health.log};
  state.tasks.forEach(t => { o.tasks[t.id] = t.done; });
  state.forks.forEach(f => { o.forks[f.id] = f.chosen; });
  state.meds.forEach(m => { o.meds[m.id] = m.packed; });
  o.prep = {}; (state.health.prep || []).forEach(x => { o.prep[x.id] = x.status; });
  o.train = state.trainPlan ? state.trainPlan.chosen : null;
  try { localStorage.setItem(LS_STATE, JSON.stringify(o)); chipText = 'Сохранено в этом браузере'; } catch (e) { chipText = 'Браузер не даёт сохранить отметки'; }
  renderChip();
}
function loadLocal() {
  let o = null;
  try { o = JSON.parse(localStorage.getItem(LS_STATE) || 'null'); } catch (e) {}
  if (!o) return;
  state.tasks.forEach(t => { if (o.tasks && t.id in o.tasks) t.done = !!o.tasks[t.id]; });
  state.forks.forEach(f => { if (o.forks && f.id in o.forks) f.chosen = o.forks[f.id]; });
  state.meds.forEach(m => { if (o.meds && m.id in o.meds) m.packed = !!o.meds[m.id]; });
  if (Array.isArray(o.log)) state.health.log = o.log;
  (state.health.prep || []).forEach(x => { if (o.prep && x.id in o.prep) x.status = o.prep[x.id]; });
  if (state.trainPlan && 'train' in o) { state.trainPlan.chosen = o.train; syncTrain(); }
}

/* ---------- copy ---------- */
function flash(btn, text) {
  btn.classList.add('ok');
  let f = btn.querySelector('.flash');
  if (!f) { f = document.createElement('span'); f.className = 'flash'; btn.appendChild(f); }
  f.textContent = text;
  setTimeout(() => { btn.classList.remove('ok'); if (f.parentNode) f.remove(); }, 1600);
}
function copyText(text, btn) {
  const fallback = () => {
    const target = btn.closest('.phrase, .dr') ? (btn.closest('.phrase') || btn.closest('.dr')).querySelector('.cn-text, .areas') : btn.querySelector('.mono, span');
    try { const r = document.createRange(); r.selectNodeContents(target || btn); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    flash(btn, 'Выделено — нажмите Ctrl+C');
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => flash(btn, 'Скопировано'), fallback); else fallback(); }
  catch (e) { fallback(); }
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('[data-back],[data-ov],[data-ovclose],[data-show],[data-go],[data-sub],[data-eat],[data-cv],[data-cvsel],[data-day],[data-prep],[data-prepset],[data-copy],[data-toggle],[data-choose],[data-train],[data-del],[data-tk],[data-tkclose],[data-tksave],[data-tkopen],[data-cal],[data-pz]');
  if (!t || !app.contains(t)) return;
  if (t.dataset.back) { history.back(); return; }
  if (t.dataset.ov) { openOv({k: t.dataset.ov}); return; }
  if (t.dataset.ovclose) { closeOv(); return; }
  if (t.dataset.show) { const it = SHOW.get(t.dataset.show); if (it) openOv({k: 'show', it}); return; }
  if (ov && t.dataset.sub) ov = null;
  if (t.dataset.pz !== undefined) { pzReplay(t); return; }
  if (t.dataset.eat) { eatCity = t.dataset.eat; if (!t.dataset.sub) { const y = window.scrollY; render(); window.scrollTo(0, y); return; } }
  if (t.dataset.tk) { openSheet(t.dataset.tk); return; }  // a policy opened from the help screen comes on top; Back returns to it
  if (t.dataset.tkclose) { closeSheet(); return; }
  if (t.dataset.tksave) { saveTicket(t.dataset.tksave, t); return; }
  if (t.dataset.tkopen) { openTicket(t.dataset.tkopen); return; }
  if (t.dataset.cal !== undefined) { saveCalendar(t); return; }
  if (t.dataset.go) { if (t.dataset.day) daySel = t.dataset.day; go(t.dataset.go, undefined, t.closest('.topbar') ? 'top' : 'content'); return; }
  if (t.dataset.cv) { cvTool(t.dataset.cv); return; }
  if (t.dataset.day) { if (!t.disabled) setDay(t.dataset.day); return; }
  if (t.dataset.prep) { prepFocus(t.dataset.prep); return; }
  if (t.dataset.cvsel) { cvSelect(t.dataset.cvsel); return; }
  if (t.dataset.sub) { const i = t.dataset.sub.indexOf('-'); go(t.dataset.sub.slice(0, i), t.dataset.sub.slice(i + 1), t.closest('.subnav') ? 'tab' : 'content'); return; }
  if (t.dataset.copy !== undefined) { copyText(t.dataset.copy, t); return; }
  if (!editable()) return;
  if (t.dataset.toggle) toggleTask(t.dataset.toggle);
  else if (t.dataset.choose) { const [f, o] = t.dataset.choose.split(':'); choose(f, o); }
  else if (t.dataset.train !== undefined) chooseTrain(t.dataset.train);
  else if (t.dataset.del !== undefined) delLog(Number(t.dataset.del));
  else if (t.dataset.prepset) { const [id, v] = t.dataset.prepset.split(':'); const x = state.health.prep.find(q => q.id === id); if (x) { x.status = x.status === v ? null : v; commit(); } }
});
app.addEventListener('change', e => {
  const c = e.target.closest('[data-pack]');
  if (!c || !editable()) return;
  const m = state.meds.find(x => x.id === c.dataset.pack); if (!m) return;
  m.packed = c.checked; commit();
  const again = document.getElementById('pk-' + m.id); if (again) again.focus({preventScroll: true});
});
document.addEventListener('keydown', e => {
  if (ov) { if (e.key === 'Escape') { e.preventDefault(); closeOv(); } return; }
  if (sheet) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    else if (e.key === 'Tab') { const f = [...document.querySelectorAll('.tsheet button')]; if (f.length && !e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); } else if (f.length && e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); } }
    return;
  }
  if (view !== 'day' || e.altKey || e.ctrlKey || e.metaKey || (e.target.closest && e.target.closest('input,select,textarea,.cv,.wx'))) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); setDay('prev'); } else if (e.key === 'ArrowRight') { e.preventDefault(); setDay('next'); }
});
app.addEventListener('submit', e => { if (e.target.id === 'logform') { e.preventDefault(); if (editable()) addLog(e.target); } });
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (h === hashOf()) return; const v = parseView(h); if (v) go(v, undefined, 'history'); });
app.addEventListener('toggle', e => { const d = e.target; if (d && d.tagName === 'DETAILS' && d.dataset.key) { if (d.open) openDetails.add(d.dataset.key); else openDetails.delete(d.dataset.key); } }, true);

/* ---------- boot ---------- */
const hasViewer = !!(window.claude && typeof window.claude.use === 'function');
if (!hasViewer) { mode = 'local'; loadLocal(); }
render();
if (hasViewer) {
  window.claude.use('downloads').then(d => { downloadsNs = d; if (sheet) { const y = window.scrollY; render(); window.scrollTo(0, y); } }, () => {});
  Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(async ([a, u]) => {
    let canEdit = false;
    try { canEdit = u ? await u.canEdit() : false; } catch (e) {}
    if (a && canEdit) { artifactNs = a; mode = 'edit'; } else mode = 'view';
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }, () => {});
}
})();
</script>
<script src="boot.js"></script>
